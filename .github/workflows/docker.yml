name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive variables
        id: vars
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then echo "IS_DEFAULT_BRANCH=true" >> $GITHUB_ENV; else echo "IS_DEFAULT_BRANCH=false" >> $GITHUB_ENV; fi
          # GHCR tags (csv)
          GHCR_TAGS="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA::7}"
          if [ "$IS_DEFAULT_BRANCH" = "true" ]; then GHCR_TAGS="$GHCR_TAGS,ghcr.io/${GITHUB_REPOSITORY}:latest"; fi
          echo "GHCR_TAGS=$GHCR_TAGS" >> $GITHUB_ENV
          # Docker Hub image name (optional)
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            if [ -n "${{ secrets.DOCKERHUB_IMAGE }}" ]; then
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_IMAGE }}" >> $GITHUB_ENV
            else
              echo "DOCKERHUB_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
            fi
            DH_TAGS="$DOCKERHUB_IMAGE:${GITHUB_SHA::7}"
            if [ "$IS_DEFAULT_BRANCH" = "true" ]; then DH_TAGS="$DH_TAGS,$DOCKERHUB_IMAGE:latest"; fi
            echo "DOCKERHUB_TAGS=$DH_TAGS" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Docker Hub)
        if: ${{ env.DOCKERHUB_IMAGE != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

