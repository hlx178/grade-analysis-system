{% extends 'base.html' %}
{% block title %}成绩管理 - 成绩分析系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>成绩列表（按学号一行）</h3>
  <div class="d-flex align-items-end gap-3 flex-wrap">
    <div>
      <label class="form-label">考试名称</label>
      <select id="examName" class="form-select">
        {% for n in exam_names %}
          <option value="{{ n }}">{{ n }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="form-label">年级</label>
      <select id="gradeFilter" class="form-select">
        <option value="">全部</option>
      </select>
    </div>
    <div>
      <label class="form-label">班级</label>
      <select id="classFilter" class="form-select">
        <option value="">全部</option>
      </select>
    </div>
    <div>
      <label class="form-label">学科</label>
      <select id="subjectFilter" class="form-select">
        <option value="">全部</option>
        {% for s in subjects %}
          <option value="{{ s.code }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadAggregated()">查询</button>
  </div>
</div>
<div class="table-responsive">
  <div class="card mb-3">
    <div class="card-header bg-light">
      <h6 class="mb-0">显示选项</h6>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showScores" checked>
            <label class="form-check-label" for="showScores">显示成绩</label>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showLetters" checked>
            <label class="form-check-label" for="showLetters">显示等第</label>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showSubRanks" checked>
            <label class="form-check-label" for="showSubRanks">显示学科班/年排</label>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="showTotalRanks" checked>
            <label class="form-check-label" for="showTotalRanks">显示总分班/年排</label>
          </div>
        </div>
      </div>
      <div class="row g-2 mt-2">
        <div class="col-auto">
          <button class="btn btn-outline-primary btn-sm" onclick="sortBy('total')">按总分排序</button>
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-primary btn-sm" onclick="sortBy('chinese')">按语文排序</button>
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-primary btn-sm" onclick="sortBy('math')">按数学排序</button>
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-primary btn-sm" onclick="sortBy('english')">按英语排序</button>
        </div>
        <div class="col-auto">
          <button class="btn btn-outline-secondary btn-sm" onclick="exportVisible()">导出当前显示</button>
        </div>
      </div>
    </div>
  </div>
  <table class="table table-hover align-middle" id="aggTable">
    <thead>
      <tr id="aggHead"></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
function cellSpan(list, opts){
  const { showScores, showLetters, showSubRanks } = opts;
  const val = v => (v === undefined || v === null) ? '' : v;
  const [score, letter, classRank, gradeRank] = list;
  const parts = [];
  if (showScores) parts.push(val(score));
  if (showLetters) parts.push(val(letter));
  if (showSubRanks) parts.push(val(classRank), val(gradeRank));
  return parts.join(' / ');
}
function totalSpan(list, opts){
  const { showScores, showLetters, showTotalRanks } = opts;
  const val = v => (v === undefined || v === null) ? '' : v;
  const [score, letter, classRank, gradeRank] = list;
  const parts = [];
  if (showScores) parts.push(val(score));
  if (showLetters) parts.push(val(letter));
  if (showTotalRanks) parts.push(val(classRank), val(gradeRank));
  return parts.join(' / ');
}
function buildHeader(opts){
  const head = document.getElementById('aggHead');
  head.innerHTML = '';
  const add = (t)=>{ const th=document.createElement('th'); th.textContent=t; head.appendChild(th); };
  add('学号'); add('姓名'); add('班级'); add('年级');
  const filterCode = document.getElementById('subjectFilter').value;
  {% for s in subjects %}
    if (!filterCode || filterCode === '{{ s.code }}') {
      add('{{ s.name }}（' + [
        ...(opts.showScores?['分']:[]),
        ...(opts.showLetters?['等第']:[]),
        ...(opts.showSubRanks?['班排','年排']:[])
      ].join('/') + '）');
    }
  {% endfor %}
  // 总分列：若未选择学科（显示全部学科）时显示；选择了具体学科时隐藏
  const filterCode2 = document.getElementById('subjectFilter').value;
  if (!filterCode2) {
    add('总分（' + [
      ...(opts.showScores?['分']:[]),
      ...(opts.showLetters?['等第']:[]),
      ...(opts.showTotalRanks?['班排','年排']:[])
    ].join('/') + '）');
  }
}
function colorize(td){
  if (!td.textContent) return;
  if (td.textContent.includes('A')) td.classList.add('text-success');
  else if (td.textContent.includes('B')) td.classList.add('text-primary');
  else if (td.textContent.includes('C')) td.classList.add('text-warning');
  else if (td.textContent.includes('D') || td.textContent.includes('E')) td.classList.add('text-danger');
}
async function loadAggregated(){
  const exam = document.getElementById('examName').value || 'default';
  const params = new URLSearchParams({ exam_name: exam });
  const g = document.getElementById('gradeFilter').value; if (g) params.set('grade', g);
  const c = document.getElementById('classFilter').value; if (c) params.set('class_name', c);
  const s = document.getElementById('subjectFilter').value; if (s) params.set('subject_code', s);
  const res = await fetch(`/api/grades/aggregated?${params.toString()}`);
  const data = await res.json();
  const tb = document.querySelector('#aggTable tbody');
  tb.innerHTML = '';
  if (!res.ok) {
    tb.innerHTML = `<tr><td colspan="20" class="text-danger">加载失败：${data.error || '未知错误'}</td></tr>`;
    return;
  }
  const opts = {
    showScores: document.getElementById('showScores').checked,
    showLetters: document.getElementById('showLetters').checked,
    showSubRanks: document.getElementById('showSubRanks').checked,
    showTotalRanks: document.getElementById('showTotalRanks').checked,
  };
  buildHeader(opts);
  const items = data.items || [];
  for (const r of items){
    const tr = document.createElement('tr');
    const base = [r['学号'], r['姓名'], r['班级'], r['年级']];
    base.forEach(v => { const td = document.createElement('td'); td.textContent = (v ?? ''); tr.appendChild(td); });
    {% for s in subjects %}
      {
        const filterCode = document.getElementById('subjectFilter').value;
        if (!filterCode || filterCode === '{{ s.code }}') {
          const td = document.createElement('td');
          td.textContent = cellSpan([
            r['{{ s.name }}分'], r['{{ s.name }}等第'], r['{{ s.name }}班排'], r['{{ s.name }}年排']
          ], opts);
          colorize(td);
          tr.appendChild(td);
        }
      }
    {% endfor %}
    {
      const filterCode3 = document.getElementById('subjectFilter').value;
      if (!filterCode3) {
        const td = document.createElement('td');
        td.textContent = totalSpan([
          r['总分'], r['总分等第'], r['总分班排'], r['总分年排']
        ], opts);
        colorize(td);
        tr.appendChild(td);
      }
    }
    tb.appendChild(tr);
  }
}
function exportVisible(){
  const exam = document.getElementById('examName').value || 'default';
  const opts = {
    showScores: document.getElementById('showScores').checked,
    showLetters: document.getElementById('showLetters').checked,
    showSubRanks: document.getElementById('showSubRanks').checked,
    showTotalRanks: document.getElementById('showTotalRanks').checked,
  };
  const s = document.getElementById('subjectFilter').value;
  const q = new URLSearchParams({ exam_name: exam, subject_code: s || '', show_scores: String(+opts.showScores), show_letters: String(+opts.showLetters), show_sub_ranks: String(+opts.showSubRanks), show_total_ranks: String(+opts.showTotalRanks) });
  window.open('/api/grades/aggregated/export?' + q.toString(), '_blank');
}
// 初始加载 & 选项切换时刷新
window.addEventListener('DOMContentLoaded', () => {
  loadAggregated();
  document.getElementById('showLetters').addEventListener('change', loadAggregated);
  document.getElementById('showSubRanks').addEventListener('change', loadAggregated);
  document.getElementById('showTotalRanks').addEventListener('change', loadAggregated);
});
</script>
{% endblock %}
