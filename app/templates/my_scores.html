{% extends 'base.html' %}
{% block title %}我的成绩 - 成绩分析系统{% endblock %}
{% block content %}
<h3>我的成绩</h3>
<div class="row g-2 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label">考试名称</label>
    <input id="examFilter" class="form-control form-control-sm mb-1" placeholder="搜索...">
    <select id="examName" class="form-select" multiple style="min-width:220px"></select>
  </div>
  <div class="col-auto">
    <label class="form-label">学科</label>
    <select id="subjectCode" class="form-select">
      <option value="TOTAL">总分</option>
      <option value="CN">语文</option>
      <option value="MA">数学</option>
      <option value="EN">英语</option>
      <option value="SC">科学</option>
      <option value="SOC">社会</option>
      <option value="MOR">道法</option>
    </select>
  </div>
  <div class="col-auto">
    <label class="form-label">排序</label>
  <div class="col-auto">
    <label class="form-label">趋势</label>
    <button class="btn btn-outline-secondary" onclick="loadTrend()">学科 vs 总分</button>
  </div>

    <select id="orderBy" class="form-select">
      <option value="score_desc">分数(高->低)</option>
      <option value="score_asc">分数(低->高)</option>
      <option value="class_rank">班级排名</option>
      <option value="grade_rank">年级排名</option>
    </select>
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" onclick="loadMySummary()">查询</button>
  </div>
</div>

<table class="table table-striped" id="mySummaryTable">
  <thead>
    <tr>
      <th>考试名称</th>
      <th>数据类型</th>
      <th>分数</th>
      <th>百分比</th>
      <th>等第</th>
      <th>班级排名</th>
      <th>年级排名</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
{% endblock %}
{% block scripts %}
<script>
async function loadSummaryOptions(){
  const res = await fetch('/api/summary/options');
<div class="card mt-3">
  <div class="card-header">学科 vs 总分 趋势</div>
  <div class="card-body">
    <canvas id="trendChart" height="140"></canvas>
  </div>
</div>

  const data = await res.json();
  const sel = document.getElementById('examName');
  sel.innerHTML = '';
  (data.exam_names||[]).forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
}

function selectedExams(){
  return Array.from(document.getElementById('examName').selectedOptions).map(o=>o.value).join(',');
}

async function loadMySummary(){
  const subject_code = document.getElementById('subjectCode').value;
  const order_by = document.getElementById('orderBy').value;
  const exam_name = selectedExams();
  const res = await fetch('/api/summary?' + new URLSearchParams({ subject_code, order_by, exam_name }));
  const data = await res.json();
  const tb = document.querySelector('#mySummaryTable tbody'); tb.innerHTML='';
  const subjName = (code)=>({TOTAL:'总分',CN:'语文',MA:'数学',EN:'英语',SC:'科学',SOC:'社会',MOR:'道法'})[code]||code;
  data.items.forEach(it=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${it.exam_name||''}</td><td>${subjName(it.subject_code||subject_code)}</td><td>${it.score}</td><td>${it.percentage??''}</td><td>${it.letter??''}</td><td>${it.class_rank??''}</td><td>${it.grade_rank??''}</td>`;
    tb.appendChild(tr);
  });

async function loadTrend(){
  const exams = selectedExams();
  if (!exams){ alert('请先选择至少一个考试'); return; }
  // 拉取学科与总分两组数据
  const subj = document.getElementById('subjectCode').value;
  if (subj==='TOTAL'){ alert('请选择一个具体学科'); return; }
  const params = (code)=> new URLSearchParams({ subject_code: code, order_by: 'score_desc', exam_name: exams });
  const [subjRes, totalRes] = await Promise.all([
    fetch('/api/summary?'+params(subj)),
    fetch('/api/summary?'+params('TOTAL'))
  ]);
  const subjData = await subjRes.json();
  const totalData = await totalRes.json();
  // 以考试名称为横轴对齐
  const labelSet = new Set();
  subjData.items.forEach(it=>labelSet.add(it.exam_name));
  totalData.items.forEach(it=>labelSet.add(it.exam_name));
  const labels = Array.from(labelSet);
  const map = (arr)=>{ const m=new Map(); arr.forEach(it=>m.set(it.exam_name, it.score)); return m; };
  const subjMap = map(subjData.items);
  const totalMap = map(totalData.items);
  const subjScores = labels.map(l=> subjMap.get(l) ?? null);
  const totalScores = labels.map(l=> totalMap.get(l) ?? null);
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (window._myChart) window._myChart.destroy();
  window._myChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '学科', data: subjScores, borderColor:'#0d6efd', backgroundColor:'rgba(13,110,253,0.1)' },
        { label: '总分', data: totalScores, borderColor:'#20c997', backgroundColor:'rgba(32,201,151,0.1)' }
      ]
    },
    options: { responsive: true, interaction: { mode:'index', intersect:false }, scales: { y: { beginAtZero: true } } }
  });
}

}

window.addEventListener('DOMContentLoaded', async ()=>{ await loadSummaryOptions(); await loadMySummary(); });
</script>
{% endblock %}
