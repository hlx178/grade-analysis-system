{% extends 'base.html' %}
{% block title %}品牌配置 - 成绩分析系统{% endblock %}
{% block content %}
<h3>品牌配置</h3>
<div id="alertBox" class="alert d-none" role="alert"></div>

<div class="row g-3">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label">学校简称</label>
          <input id="schoolName" type="text" class="form-control" placeholder="某某学校">
        </div>
        <div class="mb-2">
          <label class="form-label">学校全名</label>
          <input id="schoolNameFull" type="text" class="form-control" placeholder="某某市某某学校">
        </div>
        <div class="mb-2">
          <label class="form-label">报告副标题</label>
          <input id="subtitle" type="text" class="form-control" placeholder="学业质量监测报告">
        </div>
        <div class="mb-2">
          <label class="form-label">封面颜色</label>
          <input id="coverColor" type="color" class="form-control form-control-color" value="#0d6efd">
        </div>
        <div class="mb-2">
          <label class="form-label">页眉文案（可选）</label>
          <input id="headerText" type="text" class="form-control" placeholder="">
        </div>
        <div class="mb-2">
          <label class="form-label">页脚文案（可选）</label>
          <input id="footerText" type="text" class="form-control" placeholder="">
        </div>
        <div class="mb-3">
          <label class="form-label">学校 Logo（PNG）</label>
          <input id="logoFile" type="file" accept="image/png" class="form-control">
          <div class="form-text">建议透明底 PNG，宽高比合适将自动缩放</div>
          <img id="logoPreview" class="mt-2" style="max-height:60px"/>
        </div>
        <div>
          <button id="saveBtn" class="btn btn-primary">保存</button>
          <button id="resetBtn" class="btn btn-outline-secondary ms-2">重置表单</button>
          <button id="resetDefaultBtn" class="btn btn-warning ms-2">恢复默认配置</button>
          <span id="msg" class="ms-2"></span>
          <button id="clearLogoBtn" class="btn btn-outline-danger ms-2">清除 Logo</button>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadBrand(){
  const r = await fetch('/api/config/branding');
  if (!r.ok) return;
  const b = await r.json();
  document.getElementById('schoolName').value = b.school_name||'';
  document.getElementById('schoolNameFull').value = b.school_name_full||'';
  document.getElementById('subtitle').value = b.subtitle||'';
  document.getElementById('coverColor').value = b.cover_color||'#0d6efd';
  document.getElementById('headerText').value = b.header_text||'';
  document.getElementById('footerText').value = b.footer_text||'';
  if (b.logo_url){ document.getElementById('logoPreview').src = b.logo_url; }
}
function showAlert(cls, text){
  const box = document.getElementById('alertBox');
  box.className = `alert ${cls}`; box.textContent = text; box.classList.remove('d-none');
  setTimeout(()=>{ box.classList.add('d-none'); }, 4000);
}
async function saveBrand(){
  const btn = document.getElementById('saveBtn'); const reset = document.getElementById('resetBtn');
  btn.disabled = true; reset.disabled = true; btn.textContent = '保存中...';
  try{
    const body = {
      school_name: document.getElementById('schoolName').value,
      school_name_full: document.getElementById('schoolNameFull').value,
      subtitle: document.getElementById('subtitle').value,
      cover_color: document.getElementById('coverColor').value,
      header_text: document.getElementById('headerText').value,
      footer_text: document.getElementById('footerText').value,
    };
    const r = await fetch('/api/config/branding', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok){ showAlert('alert-danger', '保存失败'); return; }
    showAlert('alert-success', '已保存');
    // 上传 logo
    const f = document.getElementById('logoFile').files[0];
    if (f){
      if (f.type !== 'image/png' || f.size > 1024*1024){ showAlert('alert-warning', 'Logo 仅支持 PNG 且大小 <= 1MB'); }
      else {
        const fd = new FormData(); fd.append('file', f);
        const rr = await fetch('/api/config/branding/logo', { method:'POST', body: fd });
        if (rr.ok){ const j = await rr.json(); document.getElementById('logoPreview').src = j.logo_url + '?t=' + Date.now(); showAlert('alert-success', 'Logo 已更新'); }
        else { const err = await rr.json().catch(()=>({error:'上传失败'})); showAlert('alert-danger', '上传失败：'+(err.error||'')); }
      }
    }
  }catch(e){ showAlert('alert-danger', '异常：' + (e.message||e)); }
  finally{ btn.disabled = false; reset.disabled = false; btn.textContent = '保存'; }
}
function resetForm(){
  document.getElementById('schoolName').value = '';
  document.getElementById('schoolNameFull').value = '';
  document.getElementById('subtitle').value = '';
  document.getElementById('coverColor').value = '#0d6efd';
  document.getElementById('headerText').value = '';
  document.getElementById('footerText').value = '';
  document.getElementById('logoFile').value = '';
  showAlert('alert-secondary', '已重置为默认值（未保存）');
}
async function clearLogo(){
  const btn = document.getElementById('clearLogoBtn'); btn.disabled = true;
  try{
    const r = await fetch('/api/config/branding/logo', { method:'DELETE' });
    if (r.ok){ document.getElementById('logoPreview').src=''; showAlert('alert-success','Logo 已清除'); }
    else { const j = await r.json().catch(()=>({error:'失败'})); showAlert('alert-danger','清除失败：'+(j.error||'')); }
  }catch(e){ showAlert('alert-danger','异常：'+(e.message||e)); }
  finally{ btn.disabled = false; }
}
async function resetDefaults(){
  if (!confirm('确认恢复默认配置？将清除已保存的品牌设置。')) return;
  const btn = document.getElementById('resetDefaultBtn'); btn.disabled = true;
  try{
    const r = await fetch('/api/config/branding', { method:'DELETE' });
    if (r.ok){ showAlert('alert-success','已恢复默认配置'); loadBrand(); }
    else { const j = await r.json().catch(()=>({error:'失败'})); showAlert('alert-danger','操作失败：'+(j.error||'')); }
  }catch(e){ showAlert('alert-danger','异常：'+(e.message||e)); }
  finally{ btn.disabled = false; }
}
window.addEventListener('DOMContentLoaded', ()=>{
  loadBrand();
  document.getElementById('saveBtn').addEventListener('click', saveBrand);
  document.getElementById('resetBtn').addEventListener('click', resetForm);
  document.getElementById('clearLogoBtn').addEventListener('click', clearLogo);
  document.getElementById('resetDefaultBtn').addEventListener('click', resetDefaults);
});
</script>
{% endblock %}
