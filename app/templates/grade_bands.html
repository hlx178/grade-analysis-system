{% extends 'base.html' %}
{% block title %}等级规则管理 - 成绩分析系统{% endblock %}
{% block content %}
<h3>等级规则管理</h3>
<div class="row g-3 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label">考试名称</label>
    <input id="examName" class="form-control" placeholder="如：期中、期末、模拟一" value="default">
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" onclick="loadRules()">加载</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-success" onclick="saveBulk()">保存全部</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-secondary" onclick="previewDist()">预览分布</button>
  </div>
</div>

<div class="table-responsive">
<table class="table table-bordered align-middle" id="rulesTable">
  <thead>
  <tr>
    <th>学科代码</th>
    <th>学科名称</th>
    <th>方法</th>
    <th colspan="4">范围法阈值（A/B/C/D）</th>
    <th colspan="5">百分比法（A/B/C/D/E %）</th>
  </tr>
  </thead>
  <tbody>
  {% for col_name, code, name in subjects %}
  <tr data-code="{{ code }}">
    <td>{{ code }}</td>
    <td>{{ name }}</td>
    <td>
      <select class="form-select method">
        <option value="range" selected>range</option>
        <option value="percentile">percentile</option>
      </select>
    </td>
    <td><input class="form-control a_min" type="number" step="0.1" placeholder="A_min(默认80)"></td>
    <td><input class="form-control b_min" type="number" step="0.1" placeholder="B_min(默认60)"></td>
    <td><input class="form-control c_min" type="number" step="0.1" placeholder="C_min(默认40)"></td>
    <td><input class="form-control d_min" type="number" step="0.1" placeholder="D_min(默认20)"></td>
    <td><input class="form-control a_pct" type="number" step="1" min="0" max="100" placeholder="A%"></td>
    <td><input class="form-control b_pct" type="number" step="1" min="0" max="100" placeholder="B%"></td>
    <td><input class="form-control c_pct" type="number" step="1" min="0" max="100" placeholder="C%"></td>
    <td><input class="form-control d_pct" type="number" step="1" min="0" max="100" placeholder="D%"></td>
    <td><input class="form-control e_pct" type="number" step="1" min="0" max="100" placeholder="E%"></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>

<div class="row g-3 align-items-end mt-3">
  <div class="col-auto">
    <label class="form-label">预览课程ID</label>
    <input id="previewCourseId" class="form-control" type="number" placeholder="可选">
  </div>
  <div class="col-auto">
    <label class="form-label">预览班级</label>
    <input id="previewClass" class="form-control" placeholder="可选">
  </div>
</div>

<div class="mt-3" id="previewResult"></div>
{% endblock %}
{% block scripts %}
<script>
function collectItems(){
  const rows = document.querySelectorAll('#rulesTable tbody tr');
  const items = [];
  rows.forEach(tr => {
    const subject_code = tr.dataset.code;
    const method = tr.querySelector('.method').value;
    const get = sel => {
      const v = tr.querySelector(sel)?.value;
      return v === '' || v === undefined ? null : Number(v);
    };
    const obj = { subject_code, method };
    if (method === 'range'){
      obj.a_min = get('.a_min'); obj.b_min = get('.b_min'); obj.c_min = get('.c_min'); obj.d_min = get('.d_min');
    } else {
      obj.a_pct = get('.a_pct'); obj.b_pct = get('.b_pct'); obj.c_pct = get('.c_pct'); obj.d_pct = get('.d_pct'); obj.e_pct = get('.e_pct');
    }
    items.push(obj);
  });
  return items;
}

async function loadRules(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const res = await fetch(`/api/grade-bands?exam_name=${encodeURIComponent(exam_name)}`);
  const data = await res.json();
  const byCode = Object.fromEntries(data.map(x => [x.subject_code, x]));
  document.querySelectorAll('#rulesTable tbody tr').forEach(tr => {
    const code = tr.dataset.code;
    const r = byCode[code];
    if (!r) return;
    tr.querySelector('.method').value = r.method;
    if (r.method === 'range'){
      tr.querySelector('.a_min').value = r.a_min ?? '';
      tr.querySelector('.b_min').value = r.b_min ?? '';
      tr.querySelector('.c_min').value = r.c_min ?? '';
      tr.querySelector('.d_min').value = r.d_min ?? '';
    } else {
      tr.querySelector('.a_pct').value = r.a_pct ?? '';
      tr.querySelector('.b_pct').value = r.b_pct ?? '';
      tr.querySelector('.c_pct').value = r.c_pct ?? '';
      tr.querySelector('.d_pct').value = r.d_pct ?? '';
      tr.querySelector('.e_pct').value = r.e_pct ?? '';
    }
  });
}

async function saveBulk(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const items = collectItems();
  const res = await fetch('/api/grade-bands/bulk', {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ exam_name, items })
  });
  const data = await res.json();
  if (res.ok){
    alert('保存成功：' + data.count + ' 条');
  } else {
    alert('保存失败：' + (data.error || '未知错误'));
  }
}

async function previewDist(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const items = collectItems().map(x => ({...x, exam_name}));
  const course_id = Number(document.getElementById('previewCourseId').value) || null;
  const class_name = document.getElementById('previewClass').value || null;
  const res = await fetch('/api/grade-bands/preview', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ exam_name, items, course_id, class_name })
  });
  const data = await res.json();
  const el = document.getElementById('previewResult');
  if (res.ok){
    el.innerHTML = `<div class="alert alert-info">样本数: ${data.total}，分布：A=${data.distribution.A||0}, B=${data.distribution.B||0}, C=${data.distribution.C||0}, D=${data.distribution.D||0}, E=${data.distribution.E||0}</div>`;
  } else {
    el.innerHTML = `<div class="alert alert-danger">预览失败：${data.error || '未知错误'}</div>`;
  }
}
</script>
{% endblock %}
