{% extends 'base.html' %}
{% block title %}等级规则管理 - 成绩分析系统{% endblock %}
{% block content %}
<h3>等级规则管理</h3>
<div class="row g-3 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label">考试名称</label>
    <input id="examName" class="form-control" placeholder="如：期中、期末、模拟一" value="default">
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" onclick="loadRules()">加载</button>
  </div>
  <div class="col-auto">
    <select id="versionSelect" class="form-select">
      <option value="">当前活跃</option>
    </select>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-secondary" onclick="createDraft()">新建草稿</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-success" onclick="publishSet()">发布当前版本</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-success" onclick="saveBulk()">保存全部</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-primary" onclick="applyTemplateToAll()">应用到所有学科（使用首行作为模板）</button>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-secondary" onclick="previewDist()">预览分布</button>
  </div>
  <div class="w-100"></div>
  <div class="col-auto mt-2">
    <input id="srcExam" class="form-control" placeholder="来源考试名称，如：期末">
  </div>
  <div class="col-auto mt-2">
    <button class="btn btn-outline-secondary" onclick="loadSourceVersions()">拉取来源版本</button>
  </div>
  <div class="col-auto mt-2">
    <select id="srcVersionSelect" class="form-select">
      <option value="">选择来源版本</option>
    </select>
  </div>
  <div class="col-auto mt-2">
    <button class="btn btn-outline-primary" onclick="copyFromSource()">从来源复制到当前草稿</button>
  </div>
  <div class="col-auto mt-2">
    <button class="btn btn-outline-dark" onclick="exportCurrent()">导出当前版本JSON</button>
  </div>
  <div class="col-auto mt-2">
    <input type="file" id="importFile" accept="application/json" style="display:none" />
    <button class="btn btn-outline-dark" onclick="document.getElementById('importFile').click()">导入JSON到当前版本</button>
  </div>
</div>

<div class="table-responsive">
<table class="table table-bordered align-middle" id="rulesTable">
  <thead>
  <tr>
    <th>学科代码</th>
    <th>学科名称</th>
    <th>方法</th>
    <th colspan="4">范围法阈值（A/B/C/D）</th>
    <th colspan="5">百分比法（A/B/C/D/E %）</th>
  </tr>
  </thead>
  <tbody>
  {% for col_name, code, name in subjects %}
  <tr data-code="{{ code }}">
    <td>{{ code }}</td>
    <td>{{ name }}</td>
    <td>
      <select class="form-select method">
        <option value="range" selected>range</option>
        <option value="percentile">percentile</option>
      </select>
    </td>
    <td><input class="form-control a_min" type="number" step="0.1" placeholder="A_min(默认80)"></td>
    <td><input class="form-control b_min" type="number" step="0.1" placeholder="B_min(默认60)"></td>
    <td><input class="form-control c_min" type="number" step="0.1" placeholder="C_min(默认40)"></td>
    <td><input class="form-control d_min" type="number" step="0.1" placeholder="D_min(默认20)"></td>
    <td><input class="form-control a_pct" type="number" step="1" min="0" max="100" placeholder="A%"></td>
    <td><input class="form-control b_pct" type="number" step="1" min="0" max="100" placeholder="B%"></td>
    <td><input class="form-control c_pct" type="number" step="1" min="0" max="100" placeholder="C%"></td>
    <td><input class="form-control d_pct" type="number" step="1" min="0" max="100" placeholder="D%"></td>
    <td>
      <input class="form-control e_pct" type="number" step="1" min="0" max="100" placeholder="E%">
      <small class="text-muted ms-2 pct-sum">合计: 0%</small>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
</div>

<div class="row g-3 align-items-end mt-3">
  <div class="col-auto">
    <label class="form-label">预览课程ID</label>
    <input id="previewCourseId" class="form-control" type="number" placeholder="可选">
  </div>
  <div class="col-auto">
    <label class="form-label">预览班级</label>
    <input id="previewClass" class="form-control" placeholder="可选">
  </div>
</div>

<div class="mt-3" id="previewResult"></div>
{% endblock %}
{% block scripts %}
<script>
function rowPercentSum(tr){
  const method = tr.querySelector('.method').value;
  if (method !== 'percentile') return null;
  const vals = ['.a_pct','.b_pct','.c_pct','.d_pct','.e_pct']
    .map(sel => Number(tr.querySelector(sel)?.value || 0));
  return vals.reduce((a,b)=>a+b,0);
}

function updatePercentBadges(){
  document.querySelectorAll('#rulesTable tbody tr').forEach(tr => {
    const sum = rowPercentSum(tr);
    const badge = tr.querySelector('.pct-sum');
    if (!badge){ return; }
    if (sum === null){ badge.textContent = ''; return; }
    badge.textContent = `合计: ${isNaN(sum)?0:sum}%`;
    if (!isNaN(sum) && Math.round(sum) === 100){
      badge.classList.remove('text-danger');
      badge.classList.add('text-success');
    } else {
      badge.classList.remove('text-success');
      badge.classList.add('text-danger');
    }
  });
}

function collectItems(){
  const rows = document.querySelectorAll('#rulesTable tbody tr');
  const items = [];
  rows.forEach(tr => {
    const subject_code = tr.dataset.code;
    const method = tr.querySelector('.method').value;
    const get = sel => {
      const v = tr.querySelector(sel)?.value;
      return v === '' || v === undefined ? null : Number(v);
    };
    const obj = { subject_code, method };
    if (method === 'range'){
      obj.a_min = get('.a_min'); obj.b_min = get('.b_min'); obj.c_min = get('.c_min'); obj.d_min = get('.d_min');
    } else {
      obj.a_pct = get('.a_pct'); obj.b_pct = get('.b_pct'); obj.c_pct = get('.c_pct'); obj.d_pct = get('.d_pct'); obj.e_pct = get('.e_pct');
    }
    items.push(obj);
  });
  return items;
}

async function loadVersions(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const res = await fetch(`/api/grade-bands/sets?exam_name=${encodeURIComponent(exam_name)}`);
  const sets = await res.json();
  const sel = document.getElementById('versionSelect');
  sel.innerHTML = '<option value="">当前活跃</option>';
  sets.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `v${s.version} (${s.status})`;
    sel.appendChild(opt);
  });
}

async function loadRules(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const setId = document.getElementById('versionSelect').value;
  const url = setId ? `/api/grade-bands?rule_set_id=${setId}` : `/api/grade-bands?exam_name=${encodeURIComponent(exam_name)}`;
  const res = await fetch(url);
  const data = await res.json();
  const byCode = Object.fromEntries(data.map(x => [x.subject_code, x]));
  document.querySelectorAll('#rulesTable tbody tr').forEach(tr => {
    const code = tr.dataset.code;
    const r = byCode[code];
    if (!r) return;
    tr.querySelector('.method').value = r.method;
    if (r.method === 'range'){
      tr.querySelector('.a_min').value = r.a_min ?? '';
      tr.querySelector('.b_min').value = r.b_min ?? '';
      tr.querySelector('.c_min').value = r.c_min ?? '';
      tr.querySelector('.d_min').value = r.d_min ?? '';
    } else {
      tr.querySelector('.a_pct').value = r.a_pct ?? '';
      tr.querySelector('.b_pct').value = r.b_pct ?? '';
      tr.querySelector('.c_pct').value = r.c_pct ?? '';
      tr.querySelector('.d_pct').value = r.d_pct ?? '';
      tr.querySelector('.e_pct').value = r.e_pct ?? '';
    }
  });
}

function validateClient(items){
  for (const it of items){
    if (it.method === 'percentile'){
      const total = (it.a_pct||0)+(it.b_pct||0)+(it.c_pct||0)+(it.d_pct||0)+(it.e_pct||0);
      if (Math.round(total) !== 100){
        alert(`百分比法需合计100%，学科: ${it.subject_code}`);
        return false;
      }
    }
    if (it.method === 'range'){
      if ([it.a_min,it.b_min,it.c_min,it.d_min].every(v=>v!==null && v!==undefined)){
        if (!(it.a_min >= it.b_min && it.b_min >= it.c_min && it.c_min >= it.d_min)){
          alert(`范围法需满足 A>=B>=C>=D，学科: ${it.subject_code}`);
          return false;
        }
      }
    }
  }
  return true;
}

async function saveBulk(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const items = collectItems();
  if (!validateClient(items)) return;
  const res = await fetch('/api/grade-bands/bulk', {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ exam_name, items })
  });
  const data = await res.json();
  if (res.ok){
    alert('保存成功：' + data.count + ' 条');
  } else {
    alert('保存失败：' + (data.error || '未知错误'));
  }
}

async function createDraft(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const note = prompt('草稿备注（可选）:') || '';
  const res = await fetch('/api/grade-bands/sets', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ exam_name, note })
  });
  if (res.ok){
    await loadVersions();
    alert('草稿已创建');
  } else {
    const d = await res.json(); alert('创建失败：' + (d.error || '未知错误'));
  }
}

async function publishSet(){
  const setId = document.getElementById('versionSelect').value;
  if (!setId){ alert('请选择要发布的版本'); return; }
  if (!confirm('发布后将覆盖当前活跃规则，确认继续？')) return;
  const res = await fetch(`/api/grade-bands/sets/${setId}/publish`, { method: 'PUT' });
  if (res.ok){ alert('发布成功'); } else { alert('发布失败'); }
}

async function loadSourceVersions(){
  const exam = document.getElementById('srcExam').value.trim();
  if (!exam){ alert('请输入来源考试名称'); return; }
  const res = await fetch(`/api/grade-bands/sets?exam_name=${encodeURIComponent(exam)}`);
  const sets = await res.json();
  const sel = document.getElementById('srcVersionSelect');
  sel.innerHTML = '<option value="">选择来源版本</option>';
  sets.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${exam} v${s.version} (${s.status})`;
    sel.appendChild(opt);
  });
}

async function copyFromSource(){
  const srcId = document.getElementById('srcVersionSelect').value;
  if (!srcId){ alert('请选择来源版本'); return; }
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const dstSetId = document.getElementById('versionSelect').value;
  if (!dstSetId){ alert('请选择目标草稿版本'); return; }
  // 取来源JSON
  const res = await fetch(`/api/grade-bands/sets/${srcId}/export-json`);
  const data = await res.json();
  const items = data.items || [];
  // 写入目标草稿
  const res2 = await fetch(`/api/grade-bands/sets/${dstSetId}/import-json`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ items })
  });
  if (res2.ok){
    await loadRules();
    alert('复制完成');
  } else {
    alert('复制失败');
  }
}

async function exportCurrent(){
  const setId = document.getElementById('versionSelect').value;
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  let url;
  if (setId){
    url = `/api/grade-bands/sets/${setId}/export-json`;
  } else {
    // 若未选定版本，导出当前活跃规则为 JSON
    const rulesRes = await fetch(`/api/grade-bands?exam_name=${encodeURIComponent(exam_name)}`);
    const items = await rulesRes.json();
    const blob = new Blob([JSON.stringify({ exam_name, items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${exam_name}_active_rules.json`;
    a.click();
    return;
  }
  const r = await fetch(url);
  const d = await r.json();
  const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${d.exam_name}_v${d.version}.json`;
  a.click();
}

// 导入文件处理
const importInput = document.getElementById('importFile');
if (importInput){
  importInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file){ return; }
    const txt = await file.text();
    let data;
    try{ data = JSON.parse(txt); }catch(err){ alert('JSON 解析失败'); return; }
    const items = data.items || data || [];
    const dstSetId = document.getElementById('versionSelect').value;
    if (!dstSetId){ alert('请选择目标草稿版本'); return; }
    const res = await fetch(`/api/grade-bands/sets/${dstSetId}/import-json`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ items })
    });
    if (res.ok){ await loadRules(); alert('导入成功'); } else { alert('导入失败'); }
    e.target.value = '';
  });
}

function applyTemplateToAll(){
  const rows = Array.from(document.querySelectorAll('#rulesTable tbody tr'));
  if (rows.length === 0) return;
  const first = rows[0];
  const method = first.querySelector('.method').value;
  rows.forEach((tr, idx) => {
    if (idx === 0) return;
    tr.querySelector('.method').value = method;
    if (method === 'range'){
      tr.querySelector('.a_min').value = first.querySelector('.a_min').value;
      tr.querySelector('.b_min').value = first.querySelector('.b_min').value;
      tr.querySelector('.c_min').value = first.querySelector('.c_min').value;
      tr.querySelector('.d_min').value = first.querySelector('.d_min').value;
    } else {
      tr.querySelector('.a_pct').value = first.querySelector('.a_pct').value;
      tr.querySelector('.b_pct').value = first.querySelector('.b_pct').value;
      tr.querySelector('.c_pct').value = first.querySelector('.c_pct').value;
      tr.querySelector('.d_pct').value = first.querySelector('.d_pct').value;
      tr.querySelector('.e_pct').value = first.querySelector('.e_pct').value;
    }
  });
  updatePercentBadges();
}

async function previewDist(){
  const exam_name = document.getElementById('examName').value.trim() || 'default';
  const items = collectItems().map(x => ({...x, exam_name}));
  const course_id = Number(document.getElementById('previewCourseId').value) || null;
  const class_name = document.getElementById('previewClass').value || null;
  const res = await fetch('/api/grade-bands/preview', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ exam_name, items, course_id, class_name })
  });
  const data = await res.json();
  const el = document.getElementById('previewResult');
  if (res.ok){
    el.innerHTML = `<div class="alert alert-info">样本数: ${data.total}，分布：A=${data.distribution.A||0}, B=${data.distribution.B||0}, C=${data.distribution.C||0}, D=${data.distribution.D||0}, E=${data.distribution.E||0}</div>`;
  } else {
    el.innerHTML = `<div class="alert alert-danger">预览失败：${data.error || '未知错误'}</div>`;
  }
}
// 绑定事件以实时更新百分比合计提示
window.addEventListener('DOMContentLoaded', () => {
  document.querySelector('#rulesTable').addEventListener('input', (e)=>{
    if (e.target.matches('.a_pct,.b_pct,.c_pct,.d_pct,.e_pct,.method')){
      updatePercentBadges();
    }
  });
  updatePercentBadges();
  loadVersions().then(loadRules);
});
</script>
{% endblock %}
