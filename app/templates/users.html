{% extends 'base.html' %}
{% block title %}用户管理 - 成绩分析系统{% endblock %}
{% block content %}
<h3>用户管理</h3>
<div class="d-flex align-items-end gap-2 mb-2">
  <div>
    <label class="form-label">搜索</label>
    <input id="userSearch" class="form-control" placeholder="用户名/邮箱">
  </div>
  <div>
    <label class="form-label">每页</label>
    <input id="userPageSize" type="number" value="20" class="form-control" style="width:100px">
  </div>
  <button class="btn btn-primary" onclick="loadUsers(1)">查询</button>
  <div class="ms-auto">
    <div class="btn-group">
      <button class="btn btn-outline-primary" onclick="batchSave()">批量保存</button>
      <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#batchRoleModal">所选设角色</button>
      <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#batchVisModal">所选设可见范围</button>
      <button class="btn btn-outline-secondary" onclick="exportUsers()">导出CSV(当前页)</button>
      <button class="btn btn-outline-secondary" onclick="exportUsersAll()">导出CSV(按搜索条件)</button>
      <input class="form-control form-control-sm d-inline-block" id="exportInitPwd" placeholder="初始密码(可选)" style="width: 160px;"/>
      <button class="btn btn-outline-secondary" onclick="exportStudentInitXlsx()">导出学生初始化清单(XLSX)</button>
      <input type="file" id="importUsersFile" accept="text/csv,application/vnd.ms-excel" class="d-none"/>
      <button class="btn btn-outline-secondary" onclick="document.getElementById('importUsersFile').click()">导入CSV</button>
    </div>
  </div>
  <div class="ms-2 input-group input-group-sm" style="width: 340px;">
    <span class="input-group-text">批量重置密码</span>
    <input id="batchPwdInput" class="form-control" placeholder="输入新密码">
    <button class="btn btn-outline-danger" onclick="batchResetPasswords()">执行</button>
  </div>

</div>

<!-- 批量创建学生账号 -->
<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">批量创建学生账号</h5>
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">粘贴学号列表（换行、逗号或分号分隔；每项为8位数字：入学年份4位+流水号4位）</label>
        <textarea id="batchSids" class="form-control" rows="4" placeholder="如：\n20240001\n20240002\n20240003"></textarea>
      </div>
      <div class="col-sm-6">
        <label class="form-label">默认密码</label>
        <input id="batchPwd" class="form-control" placeholder="默认 123456">
      </div>
      <div class="col-sm-6 d-flex align-items-end">
        <button class="btn btn-primary" onclick="batchCreateStudentUsers()">创建账号</button>
      </div>
    </div>
    <div id="batchCreateResult" class="mt-3"></div>
  </div>
</div>

<table class="table table-bordered" id="userTable">
  <thead>
    <tr>
      <th><input type="checkbox" onclick="toggleAll(this)"></th>
      <th>ID</th>
      <th>用户名</th>
      <th>角色</th>
      <th>可见年级</th>
      <th>可见班级</th>
      <th>操作</th>
      <th>密码</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<div id="pager" class="mt-2"></div>

<!-- 批量设角色 Modal -->
<div class="modal fade" id="batchRoleModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">批量设置角色</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <select id="batchRoleSelect" class="form-select">
          <option value="teacher">teacher</option>
          <option value="student">student</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" onclick="confirmBatchRole()">确定</button>
      </div>
    </div>
  </div>
</div>

<!-- 批量设可见范围 Modal -->
<div class="modal fade" id="batchVisModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">批量设置可见范围</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">可见年级（逗号分隔）</label>
          <input id="batchGl" class="form-control" placeholder="如：七年级,八年级">
        </div>
        <div class="mb-2">
          <label class="form-label">可见班级（逗号分隔）</label>
          <input id="batchCl" class="form-control" placeholder="如：一班,二班">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn btn-primary" onclick="confirmBatchVis()">确定</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
let _optsCache = null;
async function loadOptions(){
  const r = await fetch('/api/summary/options'); if (!r.ok) return {grade_levels:[], class_names:[]};
  const d = await r.json(); _optsCache = { grades: d.grade_levels||[], classes: d.class_names||[] };
}
function fillMultiSelect(sel, items, selectedCsv){
  sel.innerHTML='';
  const set = new Set((selectedCsv||'').split(',').map(s=>s.trim()).filter(Boolean));
  items.forEach(x=>{ const o=document.createElement('option'); o.value=o.textContent=x; if (set.has(x)) o.selected = true; sel.appendChild(o); });
}

async function loadUsers(page=1){
  const q = document.getElementById('userSearch').value.trim();
  const page_size = Number(document.getElementById('userPageSize').value) || 20;
  const p = new URLSearchParams({ q, page, page_size });
  const res = await fetch('/api/users?' + p.toString());
  if (!res.ok){ alert('加载失败'); return; }
  const data = await res.json();
  const tbody = document.querySelector('#userTable tbody');
  tbody.innerHTML = '';
  data.items.forEach(u => {
    const tr = document.createElement('tr');
    tr.dataset.id = u.id;
    tr.innerHTML = `
      <td><input type="checkbox" class="rowcb"></td>
      <td>${u.id}</td>
      <td>${u.username}</td>
      <td>
        <select class="form-select form-select-sm role">
          <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
          <option value="teacher" ${u.role==='teacher'?'selected':''}>teacher</option>
          <option value="student" ${u.role==='student'?'selected':''}>student</option>
        </select>
      </td>
      <td>
        <select class="form-select form-select-sm gl" ${u.role==='student'?'disabled':''} multiple></select>
      </td>
      <td>
        <select class="form-select form-select-sm cl" ${u.role==='student'?'disabled':''} multiple></select>
      </td>
      <td><button class="btn btn-sm btn-primary" onclick="saveUser(${u.id}, this)">保存</button></td>
      <td>
        <div class="input-group input-group-sm">
          <input class="form-control newpwd" type="password" placeholder="新密码">
          <button class="btn btn-outline-danger" onclick="resetPassword(${u.id}, this)">重置</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
    // 填充下拉
    const glSel = tr.querySelector('.gl');
    const clSel = tr.querySelector('.cl');
    if (_optsCache){
      fillMultiSelect(glSel, _optsCache.grades, u.allowed_grade_levels||'');
      fillMultiSelect(clSel, _optsCache.classes, u.allowed_class_names||'');
    }
  });
  renderPager(data.total, data.page, data.page_size);
}

function toggleAll(cb){
  const cbs = document.querySelectorAll('#userTable tbody .rowcb');
  cbs.forEach(x=> x.checked = cb.checked);
}

function selectedIds(){
  return Array.from(document.querySelectorAll('#userTable tbody tr')).filter(tr=> tr.querySelector('.rowcb').checked).map(tr=> tr.dataset.id);
}

async function setRoleForSelected(){
  const sel = prompt('设置所选用户角色为（admin/teacher/student）：');
  if (!sel) return;
  const ids = selectedIds();
  if (!ids.length){ alert('请选择行'); return; }
  await fetch('/api/users/batch', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: ids.map(id=>({ id, role: sel })) }) });
  loadUsers(1);
}

async function applyVisibilityToSelected(){
  const gl = prompt('设置所选用户可见年级（逗号分隔）：', '');
  const cl = prompt('设置所选用户可见班级（逗号分隔）：', '');
  const ids = selectedIds();
  if (!ids.length){ alert('请选择行'); return; }
  await fetch('/api/users/batch', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: ids.map(id=>({ id, allowed_grade_levels: gl, allowed_class_names: cl })) }) });
  loadUsers(1);
}

function renderPager(total, page, page_size){
  const totalPages = Math.max(1, Math.ceil(total / page_size));
  const container = document.getElementById('pager');
  container.innerHTML = '';
  const mk = (p,label,dis=false)=>`<button class="btn btn-sm ${dis?'btn-secondary':'btn-outline-secondary'} me-1" ${dis?'disabled':''} onclick="loadUsers(${p})">${label}</button>`;
  container.innerHTML += mk(1,'首页', page<=1);
  container.innerHTML += mk(page-1,'上一页', page<=1);
  container.innerHTML += `<span class="me-2">第 ${page}/${totalPages} 页，共 ${total} 条</span>`;
  container.innerHTML += mk(page+1,'下一页', page>=totalPages);
  container.innerHTML += mk(totalPages,'末页', page>=totalPages);
}

async function batchSave(){
  const rows = Array.from(document.querySelectorAll('#userTable tbody tr'));
  for (const tr of rows){
    const id = tr.dataset.id;
    await saveUser(id, tr.querySelector('button'));
  }
  alert('批量保存完成');
}

async function confirmBatchRole(){
  const role = document.getElementById('batchRoleSelect').value;
  const ids = selectedIds();
  if (!ids.length){ alert('请选择行'); return; }
  await fetch('/api/users/batch', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: ids.map(id=>({ id, role })) }) });
  loadUsers(1);
  bootstrap.Modal.getInstance(document.getElementById('batchRoleModal')).hide();
}

async function confirmBatchVis(){
  const gl = document.getElementById('batchGl').value.trim();
  const cl = document.getElementById('batchCl').value.trim();
  const ids = selectedIds();
  if (!ids.length){ alert('请选择行'); return; }
  // 简单校验：允许为空或逗号分隔的非空项
  const validList = (s)=> s==='' || s.split(',').every(x=>x.trim().length>0);
  if (!validList(gl) || !validList(cl)){ alert('格式错误，请检查'); return; }
  await fetch('/api/users/batch', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: ids.map(id=>({ id, allowed_grade_levels: gl, allowed_class_names: cl })) }) });
  loadUsers(1);
  bootstrap.Modal.getInstance(document.getElementById('batchVisModal')).hide();
}

async function exportUsers(){
  // 简单CSV导出，包含当前页
  const header = ['id','username','email','role','allowed_grade_levels','allowed_class_names'];
  const rows = Array.from(document.querySelectorAll('#userTable tbody tr')).map(tr => {
    const id = tr.children[0].textContent.trim();
    const username = tr.children[1].textContent.trim();
    const email = tr.children[2].textContent.trim();
    const role = tr.querySelector('.role').value;
    const gl = tr.querySelector('.gl').value;
    const cl = tr.querySelector('.cl').value;
    return { id, username, email, role, allowed_grade_levels: gl, allowed_class_names: cl };
  });
  const si = [];
  si.push(header.join(','));
  rows.forEach(r => {
    si.push([r.id,r.username,r.email,r.role,r.allowed_grade_levels,r.allowed_class_names].join(','));
  });
  const blob = new Blob(["\ufeff" + si.join('\n')], { type:'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'users.csv';
  a.click();
}

  const allowedRoles = new Set(['admin','teacher','student']);

  for (let i=1;i<lines.length;i++){
    const cols = lines[i].split(',');

    const cl = (cols[idx.cl]||'').trim();
    if (!id || isNaN(Number(id))){ fail++; fails.push({line:i+1, reason:'id 非数字'}); continue; }

  const q = document.getElementById('userSearch').value.trim();
  const qs = new URLSearchParams();
  if (q) qs.set('q', q);
  const url = '/api/users/export?' + qs.toString();
  window.open(url || '/api/users/export', '_blank');
}

    const payload = { role, allowed_grade_levels: gl, allowed_class_names: cl };

function exportStudentInitXlsx(){
  const pwd = (document.getElementById('exportInitPwd')?.value || '').trim();
  const qs = new URLSearchParams({ format: 'xlsx' });
  if (pwd) qs.set('default_password', pwd);
  const url = '/api/admin/users/students/export-init?' + qs.toString();
  window.open(url, '_blank');

async function batchCreateStudentUsers(){
  const sids = document.getElementById('batchSids').value.trim();
  if (!sids){ alert('请输入学号列表'); return; }
  const pwd = document.getElementById('batchPwd').value.trim() || '123456';
  const res = await fetch('/api/admin/users/students/batch-create', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ student_ids: sids, default_password: pwd })
  });
  const data = await res.json();
  const el = document.getElementById('batchCreateResult');
  if (res.ok){
    el.innerHTML = `<div class="alert alert-success">创建完成：新增 ${data.created}，跳过 ${data.skipped}，无对应学生 ${data.no_student}。</div>`;
  } else {
    el.innerHTML = `<div class="alert alert-danger">操作失败：${data.error || '未知错误'}</div>`;
  }
}

      if (!res.ok){ fail++; fails.push({line:i+1, reason:'接口返回 '+res.status}); }
      else ok++;

async function saveUser(id, btn){
  const tr = btn.closest('tr');
  const role = tr.querySelector('.role').value;
  const valCsv = (sel)=> Array.from(sel.selectedOptions).map(o=>o.value).join(',');
  const payload = {
    role,
    allowed_grade_levels: role==='student' ? '' : valCsv(tr.querySelector('.gl')),
    allowed_class_names: role==='student' ? '' : valCsv(tr.querySelector('.cl')),
  };
  const res = await fetch(`/api/users/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  if (res.ok){ alert('已保存'); } else { alert('保存失败'); }
}

async function resetPassword(id, btn){
  const tr = btn.closest('tr');
  const pwd = tr.querySelector('.newpwd').value.trim();
  if (!pwd){ alert('请输入新密码'); return; }
  btn.disabled = true;
  try{
    const res = await fetch('/api/admin/users/passwords', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: [{ id, new_password: pwd }] }) });
    if (res.ok){ alert('已重置'); tr.querySelector('.newpwd').value=''; }
    else { const j = await res.json().catch(()=>({})); alert('失败: ' + (j.error||res.status)); }
  }finally{ btn.disabled = false; }
}
async function batchResetPasswords(){
  const pwd = (document.getElementById('batchPwdInput')?.value || '').trim();
  if (!pwd){ alert('请在输入框填写批量重置的新密码'); return; }
  const ids = selectedIds();
  if (!ids.length){ alert('请选择行'); return; }
  const res = await fetch('/api/admin/users/passwords', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ items: ids.map(id=>({ id, new_password: pwd })) }) });
  if (res.ok){ alert('批量重置完成'); document.getElementById('batchPwd').value=''; }
  else { const j = await res.json().catch(()=>({})); alert('失败: ' + (j.error||res.status)); }
}

window.addEventListener('DOMContentLoaded', ()=>loadUsers(1));
</script>
{% endblock %}
