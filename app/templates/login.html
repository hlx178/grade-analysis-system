{% extends 'base.html' %}
{% block title %}登录 - 成绩分析系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3 class="mb-3">登录</h3>
    <div class="login-brand"><img id="loginLogo" alt="Logo"/><div id="loginSchool">{{ brand_school_name }}</div></div>

{% block head_extra %}
<style>
.login-brand{ display:flex; align-items:center; gap:10px; margin-top:30px; margin-bottom:10px; }
.login-brand img{ height:40px; }
</style>
{% endblock %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required>
{% block scripts %}
<script>
(async function(){
  try{
    const r = await fetch('/api/config/branding'); if (!r.ok) return; const b = await r.json();
    if (b.logo_url){
      const img = document.getElementById('loginLogo');
      const url = b.logo_url + (b.logo_url.indexOf('?')>=0?'&':'?') + 't=' + Date.now();
      img.onload = ()=>{ img.style.display='block'; };
      img.onerror = ()=>{ img.style.display='none'; };
      img.src = url;
    }
    if (b.school_name){ const t = document.getElementById('loginSchool'); t.textContent = b.school_name; }
    document.title = (b.school_name||'成绩分析系统') + ' - 登录';
  }catch(e){}
})();
</script>
{% endblock %}

      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
  </div>
</div>
{% endblock %}
