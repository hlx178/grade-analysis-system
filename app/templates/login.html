{% extends 'base.html' %}
{% block title %}登录 - 成绩分析系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card shadow-sm p-4">
      <div class="d-flex align-items-center">
        <div class="flex-shrink-0 text-center" style="width:300px; margin-left:-20px;">
          <img id="loginLogo" alt="Logo" style="max-width:320px; max-height:320px; display:none"/>
          <div id="loginSchool" class="mt-2 fs-5 fw-semibold" style="display:none"></div>
        </div>
        <div style="flex:1; max-width:420px; margin-left:auto; margin-right:auto;">
          <h3 class="mb-3 text-center">登录</h3>
          <form method="post">
      <div class="mb-3">
            <label class="form-label">姓名 <span class="text-muted small">(学生登录时必填)</span></label>
            <input type="text" name="name" class="form-control" placeholder="学生请输入姓名确认">
      </div>
      <div class="mb-3">
{% block head_extra %}{% endblock %}

        <label class="form-label">用户名</label>
        <input type="text" name="username" class="form-control" required>
{% block scripts %}
<script>
(async function(){
  try{
    const r = await fetch('/api/config/branding'); if (!r.ok) return; const b = await r.json();
    if (b.logo_url){
      const img = document.getElementById('loginLogo');
      img.onload = ()=>{ img.style.display='block'; };
      img.onerror = ()=>{ img.style.display='none'; };
      img.src = b.logo_url; // 已由后端添加 ?v=mtime 防缓存
    }
    if (b.school_name){ const t = document.getElementById('loginSchool'); t.textContent = b.school_name; }
    document.title = (b.school_name||'成绩分析系统') + ' - 登录';
  }catch(e){}
})();
</script>
{% endblock %}

      </div>
      <div class="mb-3">
        <label class="form-label">密码</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
  </div>
</div>
{% endblock %}
