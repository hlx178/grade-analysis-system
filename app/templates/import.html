{% extends 'base.html' %}
{% block title %}数据导入 - 成绩分析系统{% endblock %}
{% block content %}
<h3>导入成绩（支持选择工作表）</h3>
<div class="card">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label">选择Excel文件(.xlsx)</label>
      <input class="form-control" type="file" id="fileInput" accept=".xlsx">
    </div>
    <div class="mb-3">
      <button class="btn btn-secondary" onclick="previewSheets()">预览工作表</button>
    </div>
    <div class="mb-3" id="sheetSelectWrap" style="display:none;">
      <label class="form-label">选择工作表</label>
      <select id="sheetSelect" class="form-select"></select>
    </div>
    <div class="mb-3">
      <button class="btn btn-primary" id="importBtn" onclick="importGrades()" disabled>开始导入</button>
    </div>
    <div id="result" class="mt-3"></div>
  </div>
</div>

<div class="mt-4">
  <p>支持的列（至少包含以下列）：学号、姓名、班级、课程代码、课程名称、成绩。可选列：考试类型、考试日期。</p>
</div>
{% endblock %}
{% block scripts %}
<script>
let fileId = null;
async function previewSheets(){
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) { alert('请先选择文件'); return; }
  const form = new FormData();
  form.append('file', fileInput.files[0]);
  const res = await fetch('/api/import/preview', { method: 'POST', body: form });
  const data = await res.json();
  if (!res.ok) { alert(data.error || '预览失败'); return; }
  fileId = data.file_id;
  const sel = document.getElementById('sheetSelect');
  sel.innerHTML = '';
  (data.sheets || []).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  document.getElementById('sheetSelectWrap').style.display = 'block';
  document.getElementById('importBtn').disabled = false;
}

async function importGrades(){
  const sheet = document.getElementById('sheetSelect').value;
  if (!fileId || !sheet) { alert('请先预览并选择工作表'); return; }
  const res = await fetch('/api/import/grades', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file_id: fileId, sheet_name: sheet })
  });
  const data = await res.json();
  const result = document.getElementById('result');
  if (res.ok) {
    result.innerHTML = `<div class="alert alert-success">导入完成：新增 ${data.created} 条，更新 ${data.updated} 条。</div>`;
  } else {
    result.innerHTML = `<div class="alert alert-danger">导入失败：${data.error || '未知错误'}</div>`;
  }
}
</script>
{% endblock %}
