{% extends 'base.html' %}
{% block title %}修改密码 - 成绩分析系统{% endblock %}
{% block content %}
<h3>修改密码</h3>
<div class="row justify-content-center">
  <div class="col-md-6">
    <div id="msg" class="alert d-none" role="alert"></div>
    <div class="card">
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label">当前密码</label>
          <input id="oldPwd" type="password" class="form-control" placeholder="管理员可留空">
        </div>
        <div class="mb-3">
          <label class="form-label">新密码</label>
          <input id="newPwd" type="password" class="form-control" placeholder="不少于 6 位">
        </div>
        <div class="mb-3">
          <label class="form-label">确认新密码</label>
          <input id="newPwd2" type="password" class="form-control">
        </div>
        <button id="saveBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function showMsg(cls, text){
  const el = document.getElementById('msg');
  el.className = 'alert ' + cls; el.textContent = text; el.classList.remove('d-none');
  setTimeout(()=> el.classList.add('d-none'), 4000);
}
async function save(){
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const newPwd2 = document.getElementById('newPwd2').value;
  if (!newPwd || newPwd.length < 6){ showMsg('alert-warning','新密码至少 6 位'); return; }
  if (newPwd !== newPwd2){ showMsg('alert-warning','两次输入不一致'); return; }
  const btn = document.getElementById('saveBtn'); btn.disabled = true;
  try{
    const res = await fetch('/api/auth/password', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
    });
    const j = await res.json().catch(()=>({}));
    if (res.ok){ showMsg('alert-success','已更新密码，请使用新密码重新登录'); setTimeout(()=>{ window.location.href='/auth/logout'; }, 1500); }
    else { showMsg('alert-danger', j.error || ('保存失败(' + res.status + ')')); }
  }catch(e){ showMsg('alert-danger', String(e)); }
  finally{ btn.disabled = false; }
}
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('saveBtn').addEventListener('click', save);
});
</script>
{% endblock %}
