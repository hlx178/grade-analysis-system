{% extends 'base.html' %}
{% block title %}成绩汇总 - 成绩分析系统{% endblock %}
{% block content %}
<h3>成绩汇总</h3>
<div class="row g-2 align-items-end mb-3">
  <div class="col-auto">
    <label class="form-label">考试名称</label>
    <div class="d-flex gap-2">
      <div>
        <input id="examFilter" class="form-control form-control-sm mb-1" placeholder="搜索...">
        <select id="examName" class="form-select" multiple style="min-width:220px"></select>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-outline-secondary" onclick="selectAll('examName')">全选</button>
        <button class="btn btn-outline-secondary" onclick="clearSel('examName')">清空</button>
      </div>
    </div>
  </div>
  <div class="col-auto">
    <label class="form-label">年级</label>
    <div class="d-flex gap-2">
      <div>
        <input id="gradeFilter" class="form-control form-control-sm mb-1" placeholder="搜索...">
        <select id="gradeLevel" class="form-select" multiple style="min-width:220px"></select>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-outline-secondary" onclick="selectAll('gradeLevel')">全选</button>
        <button class="btn btn-outline-secondary" onclick="clearSel('gradeLevel')">清空</button>
      </div>
    </div>
  </div>
  <div class="col-auto">
    <label class="form-label">班级</label>
    <div class="d-flex gap-2">
      <div>
        <input id="classFilter" class="form-control form-control-sm mb-1" placeholder="搜索...">
        <select id="className" class="form-select" multiple style="min-width:220px"></select>
      </div>
      <div class="btn-group btn-group-sm" role="group">
        <button class="btn btn-outline-secondary" onclick="selectAll('className')">全选</button>
        <button class="btn btn-outline-secondary" onclick="clearSel('className')">清空</button>
      </div>
    </div>
  </div>
  <div class="col-auto">
    <label class="form-label">学科</label>
    <select id="subjectCode" class="form-select">
      <option value="TOTAL">总分</option>
      <option value="CN">语文</option>
      <option value="MA">数学</option>
      <option value="EN">英语</option>
      <option value="SC">科学</option>
      <option value="SOC">社会</option>
      <option value="MOR">道法</option>
    </select>
  </div>
  <div class="col-auto">
    <label class="form-label">排序</label>
    <select id="orderBy" class="form-select">
      <option value="score_desc">分数(高->低)</option>
      <option value="score_asc">分数(低->高)</option>
      <option value="class_rank">班级排名</option>
      <option value="grade_rank">年级排名</option>
    </select>
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" onclick="loadSummary()">查询</button>
  </div>
  <div class="col-auto">
    <label class="form-label">导出范围</label>
    <select id="exportScope" class="form-select">
      <option value="current_page">当前页</option>
      <option value="all" selected>全量</option>
    </select>
  </div>
  <div class="col-auto">
    <div class="form-check mt-2">
      <input class="form-check-input" type="checkbox" id="exportUsePrefs" checked>
      <label class="form-check-label" for="exportUsePrefs">按当前列偏好导出</label>
    </div>
  </div>
  <div class="col-auto">
    <div class="btn-group">
      <button class="btn btn-outline-secondary" onclick="exportSummary('csv')">导出CSV</button>
      <button class="btn btn-outline-secondary" onclick="exportSummary('xlsx')">导出XLSX</button>
      <button class="btn btn-outline-primary" onclick="exportSummaryAsync()">异步导出</button>
      <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#exportTasksModal">任务</button>
    </div>
</div>

<!-- 导出任务列表 Modal -->
<div class="modal fade" id="exportTasksModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">导出任务</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex align-items-end gap-2 mb-2">
          <div>
            <label class="form-label">每页</label>
            <input id="taskPageSize" type="number" class="form-control" style="width:120px" value="10">
          </div>
          <div>
            <label class="form-label">状态</label>
            <select id="taskStatus" class="form-select" style="width:160px">
              <option value="">全部</option>
              <option value="pending">pending</option>
              <option value="running">running</option>
              <option value="completed">completed</option>
              <option value="failed">failed</option>
            </select>
          </div>
          <div>
            <label class="form-label">搜索</label>
            <input id="taskQuery" class="form-control" placeholder="任务ID/文件名">
          </div>
          <button class="btn btn-outline-primary" onclick="loadMyTasks(1)">加载我的任务</button>
          <button class="btn btn-outline-secondary" onclick="autoRefreshToggle(this)">开启自动刷新</button>
        </div>
        <table class="table table-sm" id="exportTasksTable">
        <script>
        // 恢复导出任务筛选记忆
        (function(){
          const st = localStorage.getItem('exportTasks.status')||'';
          const ps = localStorage.getItem('exportTasks.page_size')||'';
          const qq = localStorage.getItem('exportTasks.q')||'';
          if (st) document.getElementById('taskStatus').value = st;
          if (ps) document.getElementById('taskPageSize').value = ps;
          if (qq) document.getElementById('taskQuery').value = qq;
        })();
        </script>

          <thead><tr><th><input type="checkbox" onclick="toggleTaskAll(this)"></th><th>创建时间</th><th>任务ID</th><th>状态</th><th>进度</th><th>文件名</th><th>大小</th><th>摘要</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="taskPager" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        <button class="btn btn-outline-primary" onclick="refreshExportTasks()">刷新</button>
      </div>
        <button class="btn btn-outline-danger" onclick="deleteSelectedTasks()">删除所选</button>
        <button class="btn btn-outline-danger" onclick="deleteCompletedTasks()">批量删除已完成</button>

    </div>
  </div>
</div>


<div class="row g-3 my-3">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>考试趋势（均分）</span>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" onclick="loadTrendChart()">刷新</button>
          <a class="btn btn-outline-primary" id="trendExportBtn" href="#">导出CSV</a>
        </div>
      </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="trendChrono">
            <label class="form-check-label" for="trendChrono">按时间排序</label>
          </div>

      <div class="card-body">
        <canvas id="trendChart" height="140"></canvas>
        <div class="mt-2 small">
          <span class="me-2">显示：</span>
        <div class="small text-muted" id="trendMeta"></div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="tgAvg" checked>
            <label class="form-check-label" for="tgAvg">均分</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="tgMed" checked>
          <select id="compareTopN" class="form-select form-select-sm d-inline-block" style="width:110px">
            <option value="">全部</option>
            <option value="5">Top 5</option>
            <option value="10">Top 10</option>
            <option value="20">Top 20</option>
          </select>

            <label class="form-check-label" for="tgMed">中位数</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="tgBand" checked>
            <label class="form-check-label" for="tgBand">P25/P75 阴影</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="tgMax" checked>
            <label class="form-check-label" for="tgMax">最高</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="tgMin" checked>
            <label class="form-check-label" for="tgMin">最低</label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="distPercent">
            <label class="form-check-label" for="distPercent">百分比模式</label>
          </div>
        <div class="small text-muted" id="distMeta"></div>

          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="distCDF">
            <label class="form-check-label" for="distCDF">叠加累计分布线</label>
          </div>
        <div class="btn-group btn-group-sm">
          <a class="btn btn-outline-primary" id="exportAllBtn" href="#">打包导出三表</a>
        </div>


        <div class="form-text small text-warning" id="exportAllHint"></div>

      <div class="px-2 text-muted small" id="distRange"></div>

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>班级对比（均分）</span>
        <div class="d-flex align-items-center gap-2">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="onlyMeets">
            <label class="form-check-label" for="onlyMeets">仅显示达标</label>
          </div>
          <select id="compareSortBy" class="form-select form-select-sm d-inline-block" style="width:130px">
            <option value="avg" selected>按均分</option>
            <option value="count">按人数</option>
          </select>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="checkbox" id="exportOnlyMeets">
            <label class="form-check-label" for="exportOnlyMeets">仅导出达标</label>
          </div>
          <span class="badge bg-light text-dark" id="compareSortTag"></span>

          <div class="form-text small text-muted">图例：绿色=达标，红色=低于阈值</div>
          <div class="form-text small text-warning" id="exportPrefHint"></div>




          <input id="compareExam" class="form-control form-control-sm d-inline-block" style="width:180px" placeholder="考试名称">
          <input id="minCount" type="number" class="form-control form-control-sm d-inline-block" style="width:120px" placeholder="人数阈值(可选)">
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="loadClassCompare()">刷新</button>
            <a class="btn btn-outline-primary" id="classExportBtn" href="#">导出CSV</a>
          </div>
        </div>
      </div>
      <div class="px-2 text-muted small" id="compareMeta"></div>

      <div class="card-body"><canvas id="classCompareChart" height="140"></canvas></div>
    </div>
  </div>
</div>
  <div class="col-md-12">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>成绩分布直方图</span>
        <div class="d-flex align-items-center gap-2">
          <input id="distExam" class="form-control form-control-sm" style="width:180px" placeholder="考试名称(可选)">
          <input id="distBin" type="text" class="form-control form-control-sm" style="width:120px" placeholder="分箱宽度(数值或auto)" value="auto">
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="loadDistribution()">刷新</button>
            <a class="btn btn-outline-primary" id="distExportBtn" href="#">导出CSV</a>
          </div>
        </div>
      </div>
      <div class="card-body"><canvas id="distChart" height="120"></canvas></div>
    </div>
  </div>


</div>

<div class="mb-2">
  <label class="form-label me-2">显示列</label>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="letter" id="colLetter" checked>
    <label class="form-check-label" for="colLetter">等第</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="percentage" id="colPercentage">
    <label class="form-check-label" for="colPercentage">百分比</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="rule_version" id="colRuleVersion">
    <label class="form-check-label" for="colRuleVersion">规则版本</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="class_rank" id="colClassRank" checked>
    <label class="form-check-label" for="colClassRank">班级排名</label>
  </div>
  <div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="grade_rank" id="colGradeRank" checked>
    <label class="form-check-label" for="colGradeRank">年级排名</label>
  </div>
  <button class="btn btn-outline-secondary btn-sm ms-2" onclick="savePrefs()">保存偏好</button>
</div>

<table class="table table-striped" id="summaryTable">
  <thead>
    <tr>
      <th>学号</th>
      <th>姓名</th>
      <th>班级</th>
      <th>年级</th>
      <th>数据类型</th>
      <th>分数</th>
      <th class="col-percentage">百分比</th>
      <th class="col-letter">等第</th>
      <th class="col-class-rank">班级排名</th>
      <th class="col-grade-rank">年级排名</th>
      <th class="col-rule-version">规则版本</th>
  <tbody></tbody>
</table>
{% endblock %}
{% block scripts %}
<script>
function selectedCsv(id){ return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value).join(','); }
async function loadOptions(){
  const r = await fetch('/api/summary/options'); if(!r.ok) return; const d = await r.json();
  const fill = (id, arr)=>{ const sel=document.getElementById(id); sel.innerHTML=''; (arr||[]).forEach(x=>{ const o=document.createElement('option'); o.value=o.textContent=x; sel.appendChild(o); }); };
  fill('examName', d.exam_names);
  fill('gradeLevel', d.grade_levels);
  fill('className', d.class_names);
  // 默认选中最近一次考试（最后一个），年级/班级全选
  try{
    const examSel = document.getElementById('examName');
    if (examSel && examSel.options.length){ const last = examSel.options[examSel.options.length-1]; last.selected = true; }
    const allSel = id => Array.from(document.getElementById(id).options).forEach(o=>o.selected=true);
    allSel('gradeLevel'); allSel('className');
  }catch(e){}
}
async function loadSummary(){
  const p = new URLSearchParams({
    exam_name: selectedCsv('examName'),
    grade_level: selectedCsv('gradeLevel'),
    class_name: selectedCsv('className'),
    subject_code: document.getElementById('subjectCode').value,
    order_by: document.getElementById('orderBy').value,
    page: 1,
    page_size: 100
  });
  const r = await fetch('/api/summary?' + p.toString()); const data = await r.json();
  const tb = document.querySelector('#summaryTable tbody'); tb.innerHTML='';
  const subjName = (code)=>({TOTAL:'总分',CN:'语文',MA:'数学',EN:'英语',SC:'科学',SOC:'社会',MOR:'道法'})[code]||code;
  (data.items||[]).forEach(it=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${it.student_id||''}</td><td>${it.name||''}</td><td>${it.class_name||''}</td><td>${it.grade_level||''}</td><td>${subjName(it.subject_code||data.subject_code||'')}</td><td>${it.score}</td><td class="col-percentage">${it.percentage??''}</td><td class="col-letter">${it.letter||''}</td><td class="col-class-rank">${it.class_rank??''}</td><td class="col-grade-rank">${it.grade_rank??''}</td><td class="col-rule-version">${it.rule_version||''}</td>`;
    tb.appendChild(tr);
  });
}

function getPrefs(){
  return {
    letter: document.getElementById('colLetter').checked,
    class_rank: document.getElementById('colClassRank').checked,
    grade_rank: document.getElementById('colGradeRank').checked,
    percentage: document.getElementById('colPercentage').checked,
    rule_version: document.getElementById('colRuleVersion').checked,
    trend_chrono: document.getElementById('trendChrono')?.checked || false,
    class_compare: {
      only_meets: document.getElementById('onlyMeets')?.checked || false,
      sort_by: document.getElementById('compareSortBy')?.value || 'avg',
      min_count: Number(document.getElementById('minCount')?.value || 0) || 0,
    }
  };
}
function applyPrefs(p){
  if (!p) return;
  document.getElementById('colLetter').checked = !!p.letter;
  document.getElementById('colClassRank').checked = !!p.class_rank;
  document.getElementById('colGradeRank').checked = !!p.grade_rank;
  document.getElementById('colPercentage').checked = !!p.percentage;
  document.getElementById('colRuleVersion').checked = !!p.rule_version;
  const chrono = document.getElementById('trendChrono'); if (chrono) chrono.checked = !!p.trend_chrono;
  if (p.class_compare){
    const onlyMeets = document.getElementById('onlyMeets'); if (onlyMeets) onlyMeets.checked = !!p.class_compare.only_meets;
    const sortSel = document.getElementById('compareSortBy'); if (sortSel && p.class_compare.sort_by) sortSel.value = p.class_compare.sort_by;
    const minCountEl = document.getElementById('minCount'); if (minCountEl && (p.class_compare.min_count ?? null) !== null) minCountEl.value = p.class_compare.min_count;
    const expMeets = document.getElementById('exportOnlyMeets'); if (expMeets) expMeets.checked = !!p.class_compare.export_only_meets;
  }
  document.querySelectorAll('.col-letter').forEach(e=>e.style.display = p.letter? '':'none');
  document.querySelectorAll('.col-class-rank').forEach(e=>e.style.display = p.class_rank? '':'none');
  document.querySelectorAll('.col-grade-rank').forEach(e=>e.style.display = p.grade_rank? '':'none');
  document.querySelectorAll('.col-percentage').forEach(e=>e.style.display = p.percentage? '':'none');
  document.querySelectorAll('.col-rule-version').forEach(e=>e.style.display = p.rule_version? '':'none');
}
async function savePrefs(){
  const res = await fetch('/api/summary/prefs', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(getPrefs())});
  if (res.ok) alert('已保存'); else alert('保存失败');
}
async function loadPrefs(){
  const res = await fetch('/api/summary/prefs');
  if (res.ok){ const p = await res.json(); applyPrefs(p); }
}

function qs(){
  const exam_name = Array.from(document.getElementById('examName').selectedOptions).map(o=>o.value).join(',');
  const grade_level = Array.from(document.getElementById('gradeLevel').selectedOptions).map(o=>o.value).join(',');
  const class_name = Array.from(document.getElementById('className').selectedOptions).map(o=>o.value).join(',');
  const subject_code = document.getElementById('subjectCode').value;
  const order_by = document.getElementById('orderBy').value;
  return { exam_name, grade_level, class_name, subject_code, order_by };
}

function selectAll(id){
  const sel = document.getElementById(id);
  Array.from(sel.options).forEach(o => o.selected = true);
}
function clearSel(id){
  const sel = document.getElementById(id);
  Array.from(sel.options).forEach(o => o.selected = false);
}

function attachFilter(inputId, selectId){
  const input = document.getElementById(inputId);
  const sel = document.getElementById(selectId);
  input.addEventListener('input', ()=>{
    const kw = input.value.trim();
    Array.from(sel.options).forEach(opt => {
      opt.hidden = kw && !opt.textContent.includes(kw);
    });
  });
}

async function loadMyTasks(page=1){
    console.log('loadMyTasks called');
}

window.addEventListener('DOMContentLoaded', async ()=>{
  await loadOptions();
  await loadPrefs();
  await loadSummary();
  attachFilter('examFilter','examName');
  attachFilter('gradeFilter','gradeLevel');
  attachFilter('classFilter','className');
});
</script>
{% endblock %}
