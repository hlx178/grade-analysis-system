{% extends 'base.html' %}
{% block title %}学生管理 - 成绩分析系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>学生列表</h3>
  <div class="btn-group">
    <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">新增学生</a>
    <button class="btn btn-outline-danger" onclick="openDupDiag()">重名诊断</button>
  </div>
</div>
<div class="row g-2 align-items-end mb-2">
  <div class="col-auto">
    <label class="form-label">年级</label>
    <select id="gradeFilter" class="form-select" multiple style="min-width:200px"></select>
  </div>
  <div class="col-auto">
    <label class="form-label">班级</label>
    <select id="classFilter" class="form-select" multiple style="min-width:200px"></select>
  </div>
  <div class="col-auto">
    <button class="btn btn-outline-primary" onclick="loadStudents()">筛选</button>
  </div>
</div>
<table class="table table-hover" id="studentTable">
  <thead>
    <tr>
      <th>学号</th>
      <th>姓名</th>
      <th>班级</th>
      <th>年级</th>
      <th>分析</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- 重名诊断模态框 -->
<div class="modal fade" id="dupDiagModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">重名学生诊断</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 mb-2">
          <div class="col-auto">
            <input id="dupGrade" class="form-control form-control-sm" placeholder="年级(可选)">
          </div>
          <div class="col-auto">
            <input id="dupClass" class="form-control form-control-sm" placeholder="班级(可选)">
          </div>
          <div class="col-auto">
            <button class="btn btn-sm btn-outline-secondary" onclick="loadDupDiag()">刷新</button>
          </div>
        </div>
        <div class="small text-muted" id="dupSummary"></div>
        <div class="d-flex justify-content-between align-items-center">
          <ul class="nav nav-tabs" id="dupTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabByName" type="button" role="tab">按姓名</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabByNameGrade" type="button" role="tab">按姓名+年级</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabByNameClass" type="button" role="tab">按姓名+班级</button>
            </li>
          </ul>
          <div class="btn-group ms-2">
            <button class="btn btn-sm btn-outline-primary" onclick="exportDupCSV('by_name')">导出(按姓名)</button>
            <button class="btn btn-sm btn-outline-primary" onclick="exportDupCSV('by_name_grade')">导出(按姓名+年级)</button>
            <button class="btn btn-sm btn-outline-primary" onclick="exportDupCSV('by_name_class')">导出(按姓名+班级)</button>
          </div>
        </div>
        <div class="tab-content mt-2">
          <div class="tab-pane fade show active" id="tabByName" role="tabpanel">
            <table class="table table-sm"><thead><tr><th>姓名</th><th>数量</th><th>学生</th></tr></thead><tbody id="dupByName"></tbody></table>
          </div>
          <div class="tab-pane fade" id="tabByNameGrade" role="tabpanel">
            <table class="table table-sm"><thead><tr><th>姓名</th><th>年级</th><th>数量</th><th>学生</th></tr></thead><tbody id="dupByNameGrade"></tbody></table>
          </div>
          <div class="tab-pane fade" id="tabByNameClass" role="tabpanel">
            <table class="table table-sm"><thead><tr><th>姓名</th><th>班级</th><th>数量</th><th>学生</th></tr></thead><tbody id="dupByNameClass"></tbody></table>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
      </div>
    </div>
  </div>
</div>

<script>
function exportDupCSV(group){
  const gl = document.getElementById('dupGrade').value.trim();
  const cl = document.getElementById('dupClass').value.trim();
  const qs = new URLSearchParams(); if (gl) qs.set('grade_level', gl); if (cl) qs.set('class_name', cl); qs.set('format','csv'); qs.set('group', group);
  window.open('/api/admin/diagnose/duplicate-students?' + qs.toString(), '_blank');
}
</script>

<!-- 新增学生模态框 -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新增学生</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <div class="mb-3">
            <label class="form-label">学号</label>
            <input type="text" class="form-control" name="student_id" required>
          </div>
          <div class="mb-3">
            <label class="form-label">姓名</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">班级</label>
            <input type="text" class="form-control" name="class_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input type="email" class="form-control" name="email">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="submitStudent()">保存</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadOptions(){
  const r = await fetch('/api/students/options'); if (!r.ok) return;
  const d = await r.json();
  const gf = document.getElementById('gradeFilter');
  const cf = document.getElementById('classFilter');
  gf.innerHTML = ''; cf.innerHTML = '';
  (d.grade_levels||[]).forEach(x=>{ const o=document.createElement('option'); o.value=o.textContent=x; gf.appendChild(o); });
  (d.class_names||[]).forEach(x=>{ const o=document.createElement('option'); o.value=o.textContent=x; cf.appendChild(o); });
}
function selVals(id){ return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value).join(','); }
async function loadStudents(){
  const grade = selVals('gradeFilter');
  const clazz = selVals('classFilter');
  const q = new URLSearchParams(); if (grade) q.set('grade', grade); if (clazz) q.set('class', clazz);
  const r = await fetch('/api/students?'+q.toString()); const d = await r.json();
  const tb = document.querySelector('#studentTable tbody'); tb.innerHTML='';
  (d.items||[]).forEach(s=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.student_id}</td><td>${s.name}</td><td>${s.class_name||''}</td><td>${s.grade_level||''}</td><td><a class="btn btn-sm btn-outline-primary" href="/student-analysis?id=${s.id}">分析</a></td>`;
    tb.appendChild(tr);
  });
}
async function submitStudent() {
  const form = document.getElementById('studentForm');
  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());
  const res = await fetch('/api/students', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    try{ bootstrap.Modal.getOrCreateInstance(document.getElementById('addStudentModal')).hide(); }catch(e){}
    await loadStudents();
    form.reset();
  } else {
    alert('保存失败');
  }
}
async function openDupDiag(){ try{ bootstrap.Modal.getOrCreateInstance(document.getElementById('dupDiagModal')).show(); }catch(e){} await loadDupDiag(); }
async function loadDupDiag(){
  const gl = document.getElementById('dupGrade').value.trim();
  const cl = document.getElementById('dupClass').value.trim();
  const qs = new URLSearchParams(); if (gl) qs.set('grade_level', gl); if (cl) qs.set('class_name', cl);
  const r = await fetch('/api/admin/diagnose/duplicate-students' + (qs.toString()?('?'+qs.toString()):''));
  if (!r.ok){ alert('诊断失败'); return; }
  const d = await r.json();
  const sum = document.getElementById('dupSummary');
  sum.textContent = `学生总数：${d.total_students||0}；姓名重名组：${(d.duplicates_by_name||[]).length}；姓名+年级重名组：${(d.duplicates_by_name_grade||[]).length}；姓名+班级重名组：${(d.duplicates_by_name_class||[]).length}`;
  const render = (arr, tbodyId, cols)=>{
    const tb = document.getElementById(tbodyId); tb.innerHTML='';
    (arr||[]).forEach(it=>{
      const tr = document.createElement('tr');
      const students = (it.students||[]).map(s=>`${s.student_id||'(无学号)'} ${s.name||''} ${s.grade_level||''} ${s.class_name||''}`).join('<br/>');
      if (cols===2) tr.innerHTML = `<td>${it.name||''}</td><td>${it.count||0}</td><td>${students}</td>`;
      else if (cols===3) tr.innerHTML = `<td>${it.name||''}</td><td>${it.grade_level||''}</td><td>${it.count||0}</td><td>${students}</td>`;
      else tr.innerHTML = `<td>${it.name||''}</td><td>${it.class_name||''}</td><td>${it.count||0}</td><td>${students}</td>`;
      tb.appendChild(tr);
    });
  };
  render(d.duplicates_by_name, 'dupByName', 2);
  render(d.duplicates_by_name_grade, 'dupByNameGrade', 3);
  render(d.duplicates_by_name_class, 'dupByNameClass', 4);
}

window.addEventListener('DOMContentLoaded', async ()=>{ await loadOptions(); await loadStudents(); });
</script>
{% endblock %}
