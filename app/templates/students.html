{% extends 'base.html' %}
{% block title %}学生管理 - 成绩分析系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>学生列表</h3>
  <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">新增学生</a>
</div>
<table class="table table-hover">
  <thead>
    <tr>
      <th>学号</th>
      <th>姓名</th>
      <th>班级</th>
      <th>邮箱</th>
      <th>分析</th>
    </tr>
  </thead>
  <tbody>
  {% for s in students %}
    <tr>
      <td>{{ s.student_id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.class_name }}</td>
      <td>{{ s.email }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="/student-analysis?id={{ s.id }}">分析</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<!-- 新增学生模态框 -->
<div class="modal fade" id="addStudentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">新增学生</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="studentForm">
          <div class="mb-3">
            <label class="form-label">学号</label>
            <input type="text" class="form-control" name="student_id" required>
          </div>
          <div class="mb-3">
            <label class="form-label">姓名</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">班级</label>
            <input type="text" class="form-control" name="class_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">邮箱</label>
            <input type="email" class="form-control" name="email">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="submitStudent()">保存</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function submitStudent() {
  const form = document.getElementById('studentForm');
  const formData = new FormData(form);
  const payload = Object.fromEntries(formData.entries());
  const res = await fetch('/api/students', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    location.reload();
  } else {
    alert('保存失败');
  }
}
</script>
{% endblock %}
