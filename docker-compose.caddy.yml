version: '3.9'

services:
  app:
    image: ghcr.io/hlx178/grade-analysis-system:latest
    container_name: gas
    environment:
      - FLASK_CONFIG=production
      - EXPORT_RETENTION_DAYS=7
      - EXPORT_MAX_CONCURRENT_PER_USER=2
      - DOWNLOAD_LINK_TTL_SECONDS=3600
      - SUMMARY_COUNT_TTL_SECONDS=60
      - SUMMARY_LIST_TTL_SECONDS=60
      - ANALYSIS_TTL_SECONDS=60
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: gas-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

