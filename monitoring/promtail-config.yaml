server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
  - job_name: gas
    static_configs:
      - targets:
          - localhost
        labels:
          job: gas
          host: ${HOSTNAME}
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            ts: time
            msg: log
            stream: stream
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          stream:
      - output:
          source: msg

