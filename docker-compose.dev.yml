version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: gas-db
    environment:
      - POSTGRES_DB=gas
      - POSTGRES_USER=gas
      - POSTGRES_PASSWORD=gas_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas -d gas"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gas-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    image: gas-local:dev
    container_name: gas
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_CONFIG=development
      - DATABASE_URL=postgresql+psycopg2://gas:gas_pass@db:5432/gas
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-123456}
      - EXPORT_RETENTION_DAYS=7
      - EXPORT_MAX_CONCURRENT_PER_USER=2
      - DOWNLOAD_LINK_TTL_SECONDS=3600
      - SUMMARY_COUNT_TTL_SECONDS=60
      - SUMMARY_LIST_TTL_SECONDS=60
      - ANALYSIS_TTL_SECONDS=60
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./data:/app/data
      - ./static:/app/app/static
      - ./scripts:/app/scripts
    ports:
      - "${DEV_PORT:-8001}:8000"
    command: ["python", "run.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

