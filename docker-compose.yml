version: '3.9'
services:
  app:
    image: ghcr.io/hlx178/grade-analysis-system:latest
    container_name: gas
    ports:
      - "8000:8000"
    environment:
      - FLASK_CONFIG=production
      - EXPORT_RETENTION_DAYS=7
      - EXPORT_MAX_CONCURRENT_PER_USER=2
      - DOWNLOAD_LINK_TTL_SECONDS=3600
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

