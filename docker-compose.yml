version: '3.9'
services:
  app:
    image: ghcr.io/hlx178/grade-analysis:latest
    container_name: gas
    ports:
      - "8000:8000"
    environment:
      - FLASK_CONFIG=production
      - DATABASE_URL=sqlite:////app/data/grade_analysis.db
      - EXPORT_RETENTION_DAYS=7
      - EXPORT_MAX_CONCURRENT_PER_USER=2
      - DOWNLOAD_LINK_TTL_SECONDS=3600
      - SUMMARY_COUNT_TTL_SECONDS=60
      - SUMMARY_LIST_TTL_SECONDS=60
      - ANALYSIS_TTL_SECONDS=60
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

